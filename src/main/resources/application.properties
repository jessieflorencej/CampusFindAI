spring.application.name=CampusFind AI
spring.config.import=optional:file:./config/local.properties
server.address=${CAMPUS_BIND:127.0.0.1}
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/campus_lost_found?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=27MB
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.thymeleaf.cache=false

campus.demo-data=${DEMO_DATA:true}
campus.demo-student-password=${CAMPUS_DEMO_STUDENT_PASSWORD:}
campus.demo-admin-password=${CAMPUS_DEMO_ADMIN_PASSWORD:}
campus.storage-dir=${UPLOAD_DIRECTORY:.local/uploads}
campus.crypto-key-file=${CRYPTO_KEY_FILE:.local/encryption.key}
campus.base-url=${BASE_URL:http://localhost:8080}
campus.mail-mode=${MAIL_MODE:outbox}
campus.mail-from=${MAIL_FROM:campusfind@campus.edu}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
